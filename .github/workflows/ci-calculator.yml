name: CI Calculator

# Trigger rules: run this workflow on every push to main,
# and on every pull request that targets the main branch.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:                          # one job named "build"
    runs-on: ubuntu-latest        # run on the latest Ubuntu runner (virtual machine)

    steps:
      # Step 1: download the repository source code onto the runner
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: install a JDK on the runner (matches the local environment)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin    # use the Eclipse Temurin JDK distribution
          java-version: '21'       # JDK version matching the local development environment
          cache: maven             # cache Maven dependencies to speed up repeated builds

      # Step 3: compile all Java source files
      - name: Compile with Maven
        run: mvn clean compile

      # Step 4: run all JUnit 5 test cases from Lab 4
      - name: Run JUnit tests with Maven
        run: mvn test
